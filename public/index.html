<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jira Academy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c66e4'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EJ%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#f0f3f9; --text:#172b4d; --muted:#5e6c84; --line:#dfe3ec;
  --brand:#0c66e4; --brand2:#1d7afc; --brandSoft:#e9f2ff; --ok:#1f845a; --okSoft:#dcfff1; --ko:#c9372c; --koSoft:#ffeceb;
  --warn:#b38600; --warnSoft:#fff7d6; --epic:#6e5dc6; --story:#22a06b; --task:#1d7afc; --bug:#e2483d; --sub:#5e6c84;
  --shadow:0 1px 2px rgba(9,30,66,.08),0 4px 16px rgba(9,30,66,.06); --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --panel:#1a1e25; --panel2:#22272f; --text:#dee4ea; --muted:#9aa5b4; --line:#2e3540;
    --brand:#579dff; --brand2:#85b8ff; --brandSoft:#1c2b41; --ok:#4bce97; --okSoft:#163b2c; --ko:#f87168; --koSoft:#42221f;
    --warn:#f5cd47; --warnSoft:#3a3214; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --panel:#1a1e25; --panel2:#22272f; --text:#dee4ea; --muted:#9aa5b4; --line:#2e3540;
  --brand:#579dff; --brand2:#85b8ff; --brandSoft:#1c2b41; --ok:#4bce97; --okSoft:#163b2c; --ko:#f87168; --koSoft:#42221f;
  --warn:#f5cd47; --warnSoft:#3a3214; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.92em}
code{background:var(--panel2);padding:1px 6px;border-radius:6px}
pre{background:var(--panel2);padding:12px 14px;border-radius:10px;overflow:auto;border:1px solid var(--line)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
h2{font-size:1.45rem} h3{font-size:1.12rem;margin-top:1.4em}

/* layout */
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#6e5dc6);display:grid;place-items:center;color:#fff;font-size:15px}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem;white-space:nowrap}
.progressbar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:120px;flex:0 1 220px}
.progressbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--ok));transition:width .5s}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 16px;border-radius:10px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:22px;max-width:1280px;margin:0 auto;padding:22px 18px 60px}
nav.side{position:sticky;top:76px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);max-height:calc(100vh - 96px);overflow:auto}
nav.side .grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 10px 4px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;color:var(--text)}
.navitem:hover:not(:disabled){background:var(--panel2)}
.navitem.active{background:var(--brandSoft);color:var(--brand);font-weight:700}
.navitem:disabled{color:var(--muted);cursor:not-allowed}
.navitem .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;border:2px solid var(--line)}
.navitem .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.navitem .st.open{border-color:var(--brand);color:var(--brand)}
.navitem small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;box-shadow:var(--shadow);margin-bottom:18px}
.hero{background:linear-gradient(135deg,var(--brand),#6e5dc6);color:#fff;border:0}
.hero p{opacity:.92}
.kicker{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand)}
.hero .kicker{color:#fff;opacity:.8}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.callout{border-left:4px solid var(--brand);background:var(--brandSoft);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}
.callout.warn{border-color:var(--warn);background:var(--warnSoft)}
.callout.ok{border-color:var(--ok);background:var(--okSoft)}
.retenir{border:2px dashed var(--ok);background:var(--okSoft);border-radius:12px;padding:14px 18px;margin-top:22px}
.retenir h3{margin-top:0;color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--panel2)}
.tablewrap{overflow-x:auto}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.82rem;border-radius:6px;padding:2px 8px;color:#fff}
.t-epic{background:var(--epic)} .t-story{background:var(--story)} .t-task{background:var(--task)} .t-bug{background:var(--bug)} .t-sub{background:var(--sub)}

/* flip cards */
.flip{perspective:900px;cursor:pointer;min-height:150px}
.flip .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line)}
.flip .f{background:var(--panel2);text-align:center;align-items:center}
.flip .f .ic{font-size:2rem}
.flip .b{background:var(--brandSoft);transform:rotateY(180deg);font-size:.9rem}
.hint{font-size:.78rem;color:var(--muted)}

/* quiz */
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--panel)}
.q .qt{font-weight:700;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:9px;border:1px solid transparent;cursor:pointer}
.opt:hover{background:var(--panel2)}
.opt input{margin-top:5px}
.q.wrong{border-color:var(--ko);background:var(--koSoft)}
.q.right{border-color:var(--ok);background:var(--okSoft)}
.q .ex{font-size:.88rem;margin-top:6px;color:var(--muted)}
.score{font-size:2.4rem;font-weight:800}

/* games */
.sorter-item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--panel)}
.sorter-item .txt{flex:1 1 280px}
.sorter-item .ch{display:flex;flex-wrap:wrap;gap:5px}
.sorter-item .ch button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:3px 9px;font-size:.8rem;color:var(--text)}
.sorter-item.good{border-color:var(--ok);background:var(--okSoft)}
.sorter-item.bad{border-color:var(--ko);background:var(--koSoft)}
.order-pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.order-pool button{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 12px;color:var(--text)}
.order-res{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border:2px dashed var(--line);border-radius:10px}
.order-res span{background:var(--brand);color:#fff;border-radius:8px;padding:6px 10px;font-size:.9rem}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:220px}
.col h4{margin:2px 4px 8px;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.col.over{outline:2px solid var(--ko)}
.col.drop{outline:2px dashed var(--brand)}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;font-size:.86rem;cursor:grab;box-shadow:var(--shadow)}
.kcard.sel{outline:2px solid var(--brand)}
.kcard .k{font-size:.72rem;color:var(--muted)}
.jql input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:ui-monospace,Consolas,monospace}
.fld{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
.fib{display:flex;flex-wrap:wrap;gap:8px}
.fib button{width:54px;height:76px;border-radius:10px;border:2px solid var(--line);background:var(--panel);font-size:1.3rem;font-weight:800;color:var(--text)}
.fib button.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand)}

/* TP */
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 52px;border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--panel)}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 4px}
.check input{width:18px;height:18px;margin-top:4px;accent-color:var(--ok)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.slot{border:2px dashed var(--line);border-radius:12px;padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:8px;transition:.15s}
.slot.active{border-color:var(--brand);background:var(--brandSoft)}
.slot.filled{border-style:solid;border-color:var(--ok)}
.slot .lbl{font-weight:700;font-size:.9rem}
.slot img{width:100%;height:150px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#000}
.slot .empty{height:150px;border-radius:8px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.85rem;padding:10px}
.slot .acts{display:flex;gap:6px;flex-wrap:wrap}
.storage{font-size:.8rem;color:var(--muted)}
.storage .progressbar{display:inline-block;width:120px;height:6px;vertical-align:middle;margin:0 6px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:100;align-items:center;justify-content:center;padding:20px}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:var(--panel);padding:10px 18px;border-radius:10px;z-index:120;transition:.3s;font-weight:600;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.lockmsg{text-align:center;padding:40px 20px}
.lockmsg .big{font-size:3rem}
.footer-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.sched td:first-child{white-space:nowrap;font-family:ui-monospace,Consolas,monospace;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;background:var(--warnSoft);border:1px solid var(--warn);font-size:.85rem;font-weight:600;margin:3px}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.cert{border:6px double var(--brand);border-radius:16px;padding:36px;text-align:center;background:var(--panel)}
.cert h1{font-size:2rem;color:var(--brand)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:150}
[hidden]{display:none!important}
.authwrap{max-width:460px;margin:40px auto;padding:0 16px 60px}
.authwrap .tabs{display:flex;gap:6px;margin-bottom:14px}
.authwrap .tabs button{flex:1}
.authwrap label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.authwrap .err{color:var(--ko);font-weight:600;min-height:1.4em;margin-top:10px}
.stat{font-size:1.8rem;font-weight:800;line-height:1.1}
.mini{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:80px}
.mini > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--ok))}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--panel2)}
.boot{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.menu-toggle{display:none}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav.side{position:fixed;top:56px;left:0;right:0;max-height:70vh;border-radius:0 0 14px 14px;z-index:30;display:none}
  nav.side.open{display:block}
  .menu-toggle{display:inline-flex}
  .top .hide-sm{display:none}
  header.top{gap:8px;padding:8px 10px}
  .logo{gap:6px;font-size:.95rem}
  .logo .mark{width:26px;height:26px}
  .top .pill{padding:3px 8px}
  .card{padding:18px 16px}
  .kanban{grid-template-columns:1fr}
}
@media print{
  header.top,nav.side,.noprint,.footer-nav{display:none!important}
  .wrap{display:block;padding:0}
  .card{box-shadow:none;border:0}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<header class="top">
  <button class="btn small menu-toggle" id="menuBtn" aria-label="Menu">☰</button>
  <div class="logo"><div class="mark">J</div><span>Jira Academy <span class="hide-sm" style="font-weight:400;color:var(--muted)">· Séance Jira & Scrum</span></span></div>
  <div class="spacer"></div>
  <span class="pill hide-sm" id="who" hidden></span>
  <span class="pill" id="xp">⭐ 0 XP</span>
  <div class="progressbar hide-sm" title="Progression"><i id="pbar" style="width:0"></i></div>
  <button class="btn small" id="trainerBtn" title="Tableau de bord formateur" hidden>👩‍🏫 <span class="hide-sm">Formateur</span></button>
  <button class="btn small" id="dossierBtn" title="Mon dossier">📁 <span class="hide-sm">Mon dossier</span></button>
  <button class="btn small ghost" id="themeBtn" title="Thème">🌓</button>
  <button class="btn small ghost" id="logoutBtn" title="Se déconnecter" hidden>⏻</button>
</header>
<div class="authwrap" id="auth" hidden></div>
<div class="wrap" id="app" hidden>
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div class="lightbox" id="lb"><img id="lbimg" alt=""></div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script>
/* =========================================================
   CONNEXION AU SERVEUR (API REST)
   La progression et les captures sont enregistrées en base de données,
   donc retrouvées sur n'importe quel appareil après connexion.
   ========================================================= */
const API = '/api';
const TOKEN_KEY = 'jiraAcademy_token';
const THEME_KEY = 'jiraAcademy_theme';
const PASS = 70; // % minimum pour débloquer la suite
let READ_SECONDS = 60; // temps minimum passé sur un cours avant le contrôle
let TOKEN = (()=>{ try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } })();
let ME = null;        // utilisateur connecté
let S = {};           // état de progression (synchronisé avec le serveur)
let SHOTS = {};       // métadonnées des captures : { 'tp1_home': {name, at} }

async function api(method, path, body){
  let r;
  try{
    r = await fetch(API+path, { method, headers:{ 'Content-Type':'application/json', ...(TOKEN?{Authorization:'Bearer '+TOKEN}:{}) }, body: body!==undefined ? JSON.stringify(body) : undefined });
  }catch(e){ throw new Error('Serveur injoignable. Vérifie ta connexion Internet.'); }
  const j = await r.json().catch(()=>({}));
  if(r.status===401 && TOKEN && !path.startsWith('/auth')){ logout(true); throw new Error(j.error||'Session expirée'); }
  if(!r.ok) throw new Error(j.error || 'Erreur serveur ('+r.status+')');
  return j;
}
function normalizeS(){ S.done = S.done || {}; S.xp = S.xp || 0; S.tp = S.tp || {}; S.tries = S.tries || {}; S.badges = S.badges || []; S.games = S.games || {}; }
const stateForServer = () => { const { trainer, ...rest } = S; return rest; };
let saveTimer = null, saving = Promise.resolve();
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(pushState, 500); }
function pushState(){
  saveTimer = null; if(!TOKEN) return saving;
  saving = saving.then(()=>api('PUT','/progress',{state:stateForServer()})).catch(e=>toast('⚠️ Sauvegarde impossible : '+e.message));
  return saving;
}
// Dernière sauvegarde garantie quand on quitte / met l'onglet en arrière-plan
const flush = () => { if(saveTimer && TOKEN){ clearTimeout(saveTimer); saveTimer=null;
  fetch(API+'/progress',{method:'PUT',keepalive:true,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify({state:stateForServer()})}); } };
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flush(); });

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }
function addXP(n, why){ S.xp += n; save(); renderTop(); if(why) toast(`+${n} XP · ${why}`); }
function badge(id, label){ if(S.badges.includes(id)) return; S.badges.push(id); save(); setTimeout(()=>toast('🏅 Badge débloqué : '+label), 900); }

/* =========================================================
   CONTENU DES MODULES
   ========================================================= */
const SCRUM_SVG = `
<svg viewBox="0 0 760 340" width="100%" role="img" aria-label="Cycle Scrum">
 <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
 <g font-size="13" fill="var(--text)">
  <rect x="10" y="120" width="130" height="80" rx="12" fill="var(--brandSoft)" stroke="var(--brand)"/>
  <text x="75" y="152" text-anchor="middle" font-weight="700">Product</text><text x="75" y="170" text-anchor="middle" font-weight="700">Backlog</text>
  <text x="75" y="188" text-anchor="middle" font-size="11" fill="var(--muted)">ordonné par le PO</text>
  <path d="M140 160 H185" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="188" y="130" width="110" height="60" rx="30" fill="var(--panel2)" stroke="var(--line)"/>
  <text x="243" y="156" text-anchor="middle" font-weight="700">Sprint</text><text x="243" y="173" text-anchor="middle" font-weight="700">Planning</text>
  <path d="M298 160 H340" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="343" y="120" width="120" height="80" rx="12" fill="var(--brandSoft)" stroke="var(--brand)"/>
  <text x="403" y="152" text-anchor="middle" font-weight="700">Sprint</text><text x="403" y="170" text-anchor="middle" font-weight="700">Backlog</text>
  <text x="403" y="188" text-anchor="middle" font-size="11" fill="var(--muted)">+ objectif du sprint</text>
  <path d="M463 160 H505" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="575" cy="160" r="68" fill="none" stroke="var(--ok)" stroke-width="3" stroke-dasharray="6 5"/>

  <h3>📝 Le format d'une user story</h3>

  <p>Les <b>3 C</b> : <b>Card</b> (la phrase courte), <b>Conversation</b> (on en discute en équipe), <b>Confirmation</b> (les critères d'acceptation).</p>
  <h3>🛠️ Atelier : construis ta story</h3>
  <div class="grid3">
    <div><label class="hint">En tant que…</label><input class="fld" id="usA" placeholder="stagiaire"></div>
    <div><label class="hint">je veux…</label><input class="fld" id="usB" placeholder="consulter mes notes"></div>
    <div><label class="hint">afin de…</label><input class="fld" id="usC" placeholder="suivre ma progression"></div>
  </div>
  <div class="box" id="usOut" style="margin-top:10px;min-height:48px"></div>
  <h3>✅ Les critères INVEST</h3>
  <div class="grid3">
    ${flip('I','Indépendante','Peut être développée et livrée sans attendre une autre story.')}
    ${flip('N','Négociable','Ce n\'est pas un contrat figé : on en discute avec le PO.')}
    ${flip('V','Valeur','Apporte une valeur visible à un utilisateur ou au client.')}
    ${flip('E','Estimable','L\'équipe peut l\'estimer : elle est assez claire.')}
    ${flip('S','Small (petite)','Tient dans un sprint. Sinon : on la découpe !')}
    ${flip('T','Testable','On sait vérifier qu\'elle est terminée grâce aux critères.')}
  </div>
  <h3>🎯 Critères d'acceptation (Gherkin)</h3>
  <pre>Étant donné que je suis connecté en tant que formateur
Quand je coche « absent » pour un stagiaire et que j'enregistre
Alors l'absence apparaît dans l'historique du stagiaire avec la date du jour</pre>
  <p>Dans Jira, on écrit les critères dans la <b>Description</b> de la story (ou un champ dédié si l'admin l'a créé).</p>
  <h3>🃏 Estimer en story points</h3>
  <p>Les story points mesurent l'<b>effort relatif</b> (complexité + quantité de travail + incertitude), <b>pas des heures</b>. On utilise souvent la suite de <b>Fibonacci</b>, estimée en <i>Planning Poker</i> :</p>
  <div class="fib" id="fib"></div>
  <p id="fibMsg" class="hint">Clique sur une carte pour voir ce qu'elle signifie en général.</p>
  <h3>📏 DoR et DoD</h3>
  <div class="grid2">
    <div class="box"><b>Definition of Ready</b> (pratique d'équipe)<br>La story est prête à entrer en sprint : claire, estimée, critères écrits.</div>
    <div class="box"><b>Definition of Done</b> (officielle Scrum)<br>La story est vraiment terminée : codée, testée, revue, documentée, déployée en recette…</div>
  </div>
  <div class="retenir"><h3>✅ À retenir</h3><ul>
    <li>« En tant que… je veux… afin de… » + critères d'acceptation testables.</li>
    <li>INVEST pour vérifier qu'une story est bonne.</li>
    <li>Story points = effort <b>relatif</b>, suite de Fibonacci. Au-delà de 13 → on découpe.</li>
    <li>DoD = qualité commune pour dire « terminé ».</li></ul></div>`,
  init(){
    const upd=()=>{ const a=$('#usA').value.trim(), b=$('#usB').value.trim(), c=$('#usC').value.trim();
      let html = `<b>En tant que</b> ${esc(a||'…')}, <b>je veux</b> ${esc(b||'…')} <b>afin de</b> ${esc(c||'…')}.`;
      const tips=[]; if(!a) tips.push('Précise QUI est l\'utilisateur'); if(!c) tips.push('Sans « afin de », on ne voit pas la valeur');
      if(b && /(base de données|serveur|api|framework|react|sql)/i.test(b)) tips.push('Ça ressemble à une Task technique, pas à une story');
      if(a&&b&&c&&!tips.length){ html += '<br><span style="color:var(--ok);font-weight:700">✔ Belle story ! Pense maintenant aux critères d\'acceptation.</span>'; if(!S.games.story){S.games.story=1;addXP(10,'Story rédigée');} }
      else if(tips.length) html += '<br><span class="hint">💡 '+tips.join(' · ')+'</span>';
      $('#usOut').innerHTML = html; };
    ['#usA','#usB','#usC'].forEach(s=>$(s).addEventListener('input',upd)); upd();
    const meaning={1:'Trivial, quasi immédiat',2:'Simple et bien connu',3:'Petit, un peu de réflexion',5:'Moyen, plusieurs étapes',8:'Gros, avec de l\'incertitude',13:'Très gros : envisager de découper',21:'Trop gros : à découper obligatoirement','?':'L\'équipe manque d\'informations','☕':'On fait une pause !'};
    $('#fib').innerHTML = Object.keys(meaning).sort((x,y)=>(+x||99)-(+y||99)).map(k=>`<button data-k="${k}">${k}</button>`).join('');
    $('#fib').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; $$('#fib button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); $('#fibMsg').innerHTML=`<b>${b.dataset.k}</b> → ${meaning[b.dataset.k]}`;});
  },
  quiz:[
    {q:'Quel est le format standard d\'une user story ?', o:['En tant que…, je veux…, afin de…','Si…, alors…, sinon…','Objectif, moyen, délai','Titre, priorité, date'], a:0},
    {q:'Dans INVEST, que signifie le « I » ?', o:['Indépendante','Importante','Itérative','Intégrée'], a:0},
    {q:'Les critères d\'acceptation au format Gherkin suivent la structure…', o:['Étant donné / Quand / Alors','Avant / Pendant / Après','Qui / Quoi / Où','Début / Milieu / Fin'], a:0},
    {q:'Que mesurent les story points ?', o:['L\'effort relatif (complexité, volume, incertitude)','Le nombre exact d\'heures','Le nombre de lignes de code','La priorité métier'], a:0},
    {q:'Quelle suite est couramment utilisée pour estimer ?', o:['Fibonacci (1, 2, 3, 5, 8, 13…)','1 à 10','Les jours ouvrés','Les tailles S, M uniquement'], a:0},
    {q:'Une story est estimée à 21 points. Que faire ?', o:['La découper en stories plus petites','La mettre telle quelle dans le sprint','La transformer en bug','Doubler la durée du sprint'], a:0},
    {q:'La Definition of Done sert à…', o:['Définir quand un élément est vraiment terminé','Choisir les membres de l\'équipe','Fixer la date de fin du projet','Classer les bugs'], a:0},
    {q:'Où écrit-on habituellement les critères d\'acceptation dans Jira ?', o:['Dans la description de la story','Dans le titre du sprint','Dans le nom de l\'espace','Dans un commentaire du Scrum Master uniquement'], a:0}
  ]},

function flip(ic, title, back){ return `<div class="flip" onclick="this.classList.toggle('on')"><div class="in"><div class="f"><div class="ic">${ic}</div><b>${title}</b><span class="hint">Clique pour retourner</span></div><div class="b"><b>${title}</b><span>${back}</span></div></div></div>`; }

function orderGame(sel, correct){
  const el=$(sel); let picked=[];
  const draw=()=>{
    const pool = el._pool || (el._pool=shuffle(correct));
    el.innerHTML = `<div class="order-pool">${pool.map(x=>`<button ${picked.includes(x)?'disabled':''} data-x="${esc(x)}">${esc(x)}</button>`).join('')}</div>
      <div class="order-res">${picked.map((x,i)=>`<span>${i+1}. ${esc(x)}</span>`).join('')||'<span class="hint" style="background:none;color:var(--muted)">Ton ordre apparaîtra ici…</span>'}</div>
      <div style="margin-top:8px" id="ogMsg"></div>`;

function kanbanSim(sel){
  const el=$(sel); let sel_=null;
  const cards=[{k:'STK-4',t:'Marquer un stagiaire absent',c:0},{k:'STK-5',t:'Historique des absences',c:0},{k:'STK-9',t:'Bug : date décalée d\'un jour',c:0},{k:'STK-11',t:'Configurer la base de données',c:0},{k:'STK-6',t:'Justifier une absence',c:0}];
  const cols=['À faire','En cours','Terminé']; const WIP=2;
  const move=(k,ci)=>{ const card=cards.find(x=>x.k===k); if(!card) return;
    if(ci===1 && card.c!==1 && cards.filter(x=>x.c===1).length>=WIP){ toast('🚦 Limite WIP atteinte : termine un élément avant d\'en commencer un autre !'); return; }
    card.c=ci; sel_=null; draw(); };
  const draw=()=>{
    el.innerHTML = cols.map((n,ci)=>{ const list=cards.filter(x=>x.c===ci);
      return `<div class="col ${ci===1&&list.length>=WIP?'over':''}" data-c="${ci}"><h4><span>${n}</span><span>${list.length}${ci===1?' / '+WIP:''}</span></h4>
      ${list.map(x=>`<div class="kcard ${sel_===x.k?'sel':''}" draggable="true" data-k="${x.k}"><div class="k">${x.k}</div>${esc(x.t)}</div>`).join('')}</div>`; }).join('');
    el.querySelectorAll('.kcard').forEach(c=>{
      c.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',c.dataset.k); });
      c.addEventListener('click',e=>{ e.stopPropagation(); sel_ = sel_===c.dataset.k?null:c.dataset.k; draw(); });
    });
    el.querySelectorAll('.col').forEach(col=>{
      col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drop');});
      col.addEventListener('dragleave',()=>col.classList.remove('drop'));
      col.addEventListener('drop',e=>{e.preventDefault(); move(e.dataTransfer.getData('text/plain'), +col.dataset.c);});
      col.addEventListener('click',()=>{ if(sel_) move(sel_, +col.dataset.c); });
    });
    const done=cards.filter(x=>x.c===2).length;
    $('#kbMsg').innerHTML = done===cards.length ? '<b style="color:var(--ok)">🎉 Sprint terminé ! Tous les éléments sont dans « Terminé ». C\'est le moment de cliquer sur « Terminer le sprint » dans Jira.</b>' : `${done}/${cards.length} éléments terminés.`;
    if(done===cards.length && !S.games.kanban){ S.games.kanban=1; addXP(15,'Sprint simulé'); badge('kanban','Gardien du flux'); }
  }; draw();
}

function renderQuiz(container, mod, questions, onPass){
  const qs = shuffle(questions).map(q=>{ const idx=shuffle(q.o.map((_,i)=>i)); return {...q, o:idx.map(i=>q.o[i]), a:idx.indexOf(q.a)}; });
  container.innerHTML = `<div class="kicker">Contrôle des acquis</div><h2>📝 ${mod.id==='final'?'Contrôle final':'Teste-toi'} — ${qs.length} questions</h2>
    <p class="hint">Score minimum pour débloquer la suite : <b>${PASS}%</b>. Tu peux recommencer autant de fois que nécessaire (les questions sont mélangées).</p>
    <form id="qf">${qs.map((q,i)=>`<div class="q" id="q${i}"><div class="qt">${i+1}. ${esc(q.q)}</div>${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}<div class="ex"></div></div>`).join('')}
    <button class="btn primary" type="submit">Valider mes réponses</button></form><div id="qres"></div>`;
  container.querySelector('#qf').onsubmit = e=>{
    e.preventDefault();
    const fd=new FormData(e.target); let good=0, missing=0;
    qs.forEach((q,i)=>{ const v=fd.get('q'+i); if(v===null) missing++; });
    if(missing){ toast(`Réponds à toutes les questions (${missing} manquante${missing>1?'s':''})`); return; }
    S.tries[mod.id]=(S.tries[mod.id]||0)+1;
    qs.forEach((q,i)=>{ const v=+fd.get('q'+i); const box=container.querySelector('#q'+i); box.classList.remove('right','wrong');
      if(v===q.a){ good++; box.classList.add('right'); } else box.classList.add('wrong'); });
    const pct=Math.round(good*100/qs.length); const passed=pct>=PASS;
    // On montre les corrections seulement après réussite (sinon on dit juste quelles questions sont fausses)
    if(passed) qs.forEach((q,i)=>{ const box=container.querySelector('#q'+i); if(box.classList.contains('wrong')) box.querySelector('.ex').innerHTML='Bonne réponse : <b>'+esc(q.o[q.a])+'</b>'+(q.e?' — '+esc(q.e):''); });
    container.querySelectorAll('input').forEach(x=>x.disabled=true);
    const res=container.querySelector('#qres');
    res.innerHTML = `<div class="card" style="text-align:center;margin-top:14px;${passed?'border-color:var(--ok)':'border-color:var(--ko)'}">
      <div class="score" style="color:${passed?'var(--ok)':'var(--ko)'}">${pct}%</div><div>${good}/${qs.length} bonnes réponses</div>
      <p>${passed?'🎉 Bravo, partie validée ! La suite est débloquée.':'Pas encore… Relis le cours (les questions en rouge te guident) puis réessaie.'}</p>
      ${passed?'':'<button class="btn primary" id="retry">Recommencer le contrôle</button>'}</div>`;
    save();
    if(passed){ const prev=S.done[mod.id]; if(!prev || pct>prev.score){ if(!prev) addXP(pct, 'Contrôle réussi'); S.done[mod.id]={score:pct,at:Date.now(),tries:S.tries[mod.id]}; save(); }
      if(pct===100) badge('perfect_'+mod.id,'Sans faute : '+mod.title);
      confetti(); renderSide(); renderTop(); onPass && onPass(pct); }
    else res.querySelector('#retry').onclick=()=>{ renderQuiz(container, mod, questions, onPass); container.scrollIntoView({behavior:'smooth'}); };
    res.scrollIntoView({behavior:'smooth', block:'center'});
  };
}

/* =========================================================
   CAPTURES D'ÉCRAN (compressées puis envoyées au serveur)
   ========================================================= */
const shotUrl = (uid, tp, slot, at) => `${API}/img/${encodeURIComponent(uid)}/${encodeURIComponent(tp)}/${encodeURIComponent(slot)}?t=${encodeURIComponent(TOKEN)}&v=${at||0}`;
function getShot(tp, slot){ const s=SHOTS[tp+'_'+slot]; return s && ME ? {...s, data: shotUrl(ME.id, tp, slot, s.at)} : null; }
function compress(file, maxW, q){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
    const sc=Math.min(1, maxW/img.width); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; img.src=r.result; }; r.readAsDataURL(file); });
}
async function storeShot(tp, slot, file){
  if(!file || !file.type.startsWith('image/')){ toast('Ce fichier n\'est pas une image.'); return false; }
  toast('⏳ Envoi de la capture…');
  try{
    let data = await compress(file, 1600, .78);
    if(data.length > 3.5e6) data = await compress(file, 1100, .6);
    const r = await api('PUT', `/shots/${tp}/${slot}`, { data, name: file.name||'capture.png' });
    SHOTS[tp+'_'+slot] = { name:r.name, at:r.at };
    return true;
  }catch(e){ toast('⚠️ '+e.message); return false; }
}
async function deleteShot(tp, slot){
  try{ await api('DELETE', `/shots/${tp}/${slot}`); delete SHOTS[tp+'_'+slot]; return true; }
  catch(e){ toast('⚠️ '+e.message); return false; }
}
async function toDataURL(url){
  const b = await (await fetch(url)).blob();
  return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(b); });
}

    <div class="card"><h3 style="margin-top:0">☑️ Auto-vérification</h3>${m.checks.map((c,i)=>`<label class="check"><input type="checkbox" data-c="${i}" ${st.checks[i]?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div>
    <div class="card"><h3 style="margin-top:0">📸 Mes captures d'écran</h3>
      <p class="hint">Clique sur une case puis <b>Ctrl+V</b> pour coller une capture (Windows : <b>Win+Maj+S</b> · Mac : <b>Cmd+Ctrl+Maj+4</b>), ou glisse-dépose une image, ou utilise le bouton. Les images sont compressées puis enregistrées sur le serveur.</p>
      <div class="slots">${m.shots.map(s=>{ const sh=getShot(m.id,s.id); return `<div class="slot ${sh?'filled':''} ${active===s.id?'active':''}" data-s="${s.id}" tabindex="0">
        <div class="lbl">${sh?'✅':'⬜'} ${esc(s.label)}</div><div class="hint">${esc(s.tip)}</div>
        ${sh?`<img src="${sh.data}" alt="${esc(s.label)}" data-zoom="1">`:`<div class="empty">Clique ici puis <b>Ctrl+V</b><br>ou dépose une image</div>`}
        <div class="acts"><label class="btn small">📂 ${sh?'Remplacer':'Choisir'}<input type="file" accept="image/*" hidden data-f="${s.id}"></label>${sh?`<button class="btn small" data-del="${s.id}">🗑️ Supprimer</button>`:''}</div></div>`; }).join('')}</div>
      <p class="storage" style="margin-top:12px">☁️ ${filled} capture${filled>1?'s':''} enregistrée${filled>1?'s':''} sur le serveur.</p></div>
    <div class="card" style="text-align:center">
      ${S.done[m.id]?'<p>✅ TP validé. Tu peux encore modifier tes captures.</p>':`<p>${ready?'Tout est prêt !':'Coche toutes les vérifications et ajoute toutes les captures pour valider.'}</p>`}
      <button class="btn ok" id="validTP" ${ready&&!S.done[m.id]?'':'disabled'}>✔ Valider le TP</button></div>
    ${navFooter(m)}`;
    $$('input[data-c]').forEach(c=>c.onchange=()=>{ st.checks[c.dataset.c]=c.checked; save(); draw(); });
    $$('.slot').forEach(sl=>{
      sl.onclick=e=>{ if(e.target.closest('button,label,img')) return; active=sl.dataset.s; $$('.slot').forEach(x=>x.classList.toggle('active',x===sl)); toast('Case sélectionnée : fais Ctrl+V pour coller ta capture'); };
      sl.ondragover=e=>{e.preventDefault(); sl.classList.add('active');};
      sl.ondragleave=()=>sl.classList.remove('active');
      sl.ondrop=async e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(await storeShot(m.id, sl.dataset.s, f)){ toast('📸 Capture enregistrée'); draw(); } };
    });
    $$('input[data-f]').forEach(inp=>inp.onchange=async()=>{ if(await storeShot(m.id, inp.dataset.f, inp.files[0])){ toast('📸 Capture enregistrée'); draw(); } });
    $$('button[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('Supprimer cette capture ?')){ deleteShot(m.id,b.dataset.del).then(ok=>ok&&draw()); } });
    $$('img[data-zoom]').forEach(im=>im.onclick=()=>zoom(im.src));
    $('#validTP').onclick=()=>{ S.done[m.id]={score:null,at:Date.now()}; save(); addXP(50,'TP validé'); confetti(); badge('tp_'+m.id, m.title.split('·')[0].trim()+' réussi'); renderAll(); };
  };
  window.onpaste = async e=>{
    if(current!==m.id) return;
    const item=[...(e.clipboardData||{}).items||[]].find(x=>x.type.startsWith('image/')); if(!item) return;
    const target = active || (m.shots.find(s=>!getShot(m.id,s.id))||m.shots[0]).id;
    if(await storeShot(m.id, target, item.getAsFile())){ toast('📸 Capture collée dans « '+m.shots.find(s=>s.id===target).label+' »'); active=null; draw(); }
  };
  draw();
}

async function exportDossier(st=S, user={name:S.name, group:S.group}, getter=getShot){
  toast('⏳ Préparation du dossier…');
  st = {done:{}, tries:{}, badges:[], xp:0, ...st};
  const imgs = {};
  for(const m of TPS()) for(const s of m.shots){ const sh=getter(m.id,s.id); if(sh){ try{ imgs[m.id+'_'+s.id]={...sh, data:await toDataURL(sh.data)}; }catch(e){} } }
  const rows=MODULES.filter(m=>m.type!=='intro').map(m=>`<tr><td>${esc(m.title)}</td><td>${st.done[m.id]?'Validé':'Non validé'}</td><td>${st.done[m.id]&&st.done[m.id].score!=null?st.done[m.id].score+'%':''}</td><td>${st.tries[m.id]||''}</td></tr>`).join('');
  const shots=TPS().map(m=>`<h2>${esc(m.title)} ${st.done[m.id]?'✅':'❌'}</h2>`+m.shots.map(s=>{const sh=imgs[m.id+'_'+s.id];return `<figure><figcaption><b>${esc(s.label)}</b>${sh?' — '+new Date(sh.at).toLocaleString('fr-FR'):''}</figcaption>${sh?`<img src="${sh.data}">`:'<p><i>Capture manquante</i></p>'}</figure>`;}).join('')).join('');
  const html=`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Dossier Jira - ${esc(user.name||'')}</title><style>body{font-family:system-ui;max-width:1000px;margin:auto;padding:24px;color:#172b4d}table{border-collapse:collapse;width:100%}td,th{border:1px solid #dfe3ec;padding:6px 10px;text-align:left}th{background:#f0f3f9}img{max-width:100%;border:1px solid #dfe3ec;border-radius:8px}figure{margin:16px 0}h1{color:#0c66e4}</style></head><body>
  <h1>Dossier de séance — Jira & Scrum</h1><p><b>Stagiaire :</b> ${esc(user.name||'')}<br><b>Groupe :</b> ${esc(user.group||'')}<br><b>Exporté le :</b> ${new Date().toLocaleString('fr-FR')}<br><b>XP :</b> ${st.xp} · <b>Badges :</b> ${st.badges.map(badgeName).map(esc).join(', ')||'—'}</p>
  <h2>Résultats</h2><table><tr><th>Partie</th><th>Statut</th><th>Score</th><th>Essais</th></tr>${rows}</table>${shots}</body></html>`;
  download(html, `Dossier_Jira_${safeName(user.name)}.html`, 'text/html');
  toast('📦 Dossier exporté');
}
const safeName = n => (n||'stagiaire').replace(/[^\p{L}\p{N}]+/gu,'_');
function download(content, filename, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

  $('#exp').onclick=()=>exportDossier(st, u, getter);
  $('#pwd').onclick=async()=>{ const p=prompt(`Nouveau mot de passe pour ${u.name} (8 caractères minimum) :`); if(!p) return;
    try{ await api('POST',`/admin/users/${encodeURIComponent(u.id)}/password`,{password:p}); toast('🔑 Mot de passe modifié. Communique-le au stagiaire.'); }catch(e){ toast('⚠️ '+e.message); } };
  $('#del').onclick=async()=>{ if(prompt(`Supprimer définitivement le compte de ${u.name} et toutes ses données ?\nTape SUPPRIMER pour confirmer :`)!=='SUPPRIMER') return;
    try{ await api('DELETE','/admin/users/'+encodeURIComponent(u.id)); toast('Compte supprimé'); renderTrainer(); }catch(e){ toast('⚠️ '+e.message); } };
}

/* ---------- utilitaires visuels ---------- */
function zoom(src){ $('#lbimg').src=src; $('#lb').classList.add('on'); }
$('#lb').onclick=()=>$('#lb').classList.remove('on');
function confetti(){
  const c=$('#confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#0c66e4','#6e5dc6','#22a06b','#e2483d','#f5cd47'];
  const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,s:Math.random()*7+4,c:cols[Math.random()*5|0],r:Math.random()*6}));
  let f=0; (function tick(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});
    if(++f<110) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height); })();
}

/* ---------- en-tête ---------- */
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#dossierBtn').onclick=()=>{ if(!ME) return; $('#side').classList.remove('open'); renderDossier(); };
$('#trainerBtn').onclick=()=>{ $('#side').classList.remove('open'); renderTrainer(); };
$('#logoutBtn').onclick=()=>{ if(confirm('Se déconnecter ?')) logout(); };
$('#themeBtn').onclick=()=>{ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; S.theme=r.dataset.theme; try{ localStorage.setItem(THEME_KEY,S.theme); }catch(e){} if(ME) save(); };
try{ const t=localStorage.getItem(THEME_KEY); if(t) document.documentElement.dataset.theme=t; }catch(e){}

/* =========================================================
   CONNEXION / INSCRIPTION
   ========================================================= */
let AUTH_CFG = null;
async function renderAuth(mode){
  mode = mode || renderAuth.mode || 'login'; renderAuth.mode = mode;
  document.body.classList.add('guest');
  $('#app').hidden=true; $('#auth').hidden=false;
  ['#trainerBtn','#logoutBtn','#dossierBtn','#xp','#who','#menuBtn'].forEach(s=>$(s).hidden=true); $('#pbar').parentElement.hidden=true;
  if(!AUTH_CFG){ try{ AUTH_CFG = await (await fetch(API+'/config')).json(); }catch(e){ AUTH_CFG = {}; } }
  const reg = mode==='register';
  $('#auth').innerHTML = `
  <div class="card hero" style="text-align:center"><div class="kicker">Séance Jira & Scrum</div><h1 style="font-size:1.7rem;margin-bottom:.2em">Jira Academy 🚀</h1>
    <p style="margin:0">Connecte-toi pour retrouver ta progression sur n'importe quel appareil.</p></div>
  <div class="card">
    <div class="tabs"><button class="btn ${reg?'':'primary'}" id="tabLogin">Se connecter</button><button class="btn ${reg?'primary':''}" id="tabReg">Créer un compte</button></div>
    <form id="authForm" novalidate>
      ${reg?`<label for="aName">Prénom et nom</label><input class="fld" id="aName" autocomplete="name" required>
      <label for="aGroup">Groupe <span class="hint">(ex : DEV-201)</span></label><input class="fld" id="aGroup" autocomplete="off">`:''}
      <label for="aEmail">E-mail</label><input class="fld" id="aEmail" type="email" autocomplete="email" required>
      <label for="aPass">Mot de passe ${reg?'<span class="hint">(8 caractères minimum)</span>':''}</label><input class="fld" id="aPass" type="password" autocomplete="${reg?'new-password':'current-password'}" required>
      ${reg?`<label for="aCode">${AUTH_CFG.classCodeRequired?'Code de classe <span class="hint">(donné par ton formateur)</span>':'Code de classe ou code formateur <span class="hint">(facultatif)</span>'}</label><input class="fld" id="aCode" autocomplete="off">`:''}
      <div class="err" id="aErr"></div>
      <button class="btn primary" type="submit" style="width:100%" id="aBtn">${reg?'Créer mon compte':'Se connecter'}</button>
    </form>
    ${reg?'':'<p class="hint" style="text-align:center;margin:12px 0 0">Mot de passe oublié ? Demande à ton formateur de le réinitialiser.</p>'}
  </div>`;
  $('#tabLogin').onclick=()=>renderAuth('login');
  $('#tabReg').onclick=()=>renderAuth('register');
  $('#authForm').onsubmit=async e=>{
    e.preventDefault(); const btn=$('#aBtn'), err=$('#aErr'); err.textContent=''; btn.disabled=true;
    const v=s=>{ const el=$(s); return el?el.value.trim():''; };
    try{
      const r = reg
        ? await api('POST','/auth/register',{name:v('#aName'),group:v('#aGroup'),email:v('#aEmail'),password:$('#aPass').value,code:v('#aCode')})
        : await api('POST','/auth/login',{email:v('#aEmail'),password:$('#aPass').value});
      TOKEN=r.token; try{ localStorage.setItem(TOKEN_KEY,TOKEN); }catch(e){}
      boot();
    }catch(ex){ err.textContent=ex.message; btn.disabled=false; }
  };
  (reg?$('#aName'):$('#aEmail')).focus();
}

function logout(expired){
  flush(); TOKEN=''; ME=null; S={}; SHOTS={}; clearInterval(readTimer); window.onpaste=null;
  try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
  renderAuth('login'); if(expired) toast('Session expirée, reconnecte-toi.');
}

async function boot(){
  if(!TOKEN) return renderAuth();
  document.body.classList.remove('guest');
  $('#auth').hidden=true; $('#app').hidden=false;
  ['#dossierBtn','#xp','#who','#menuBtn','#logoutBtn'].forEach(s=>$(s).hidden=false); $('#pbar').parentElement.hidden=false;
  $('#side').innerHTML=''; $('#main').innerHTML='<div class="card boot">⏳ Chargement de ta progression…</div>';
  let r;
  try{ r = await api('GET','/me'); }
  catch(e){ if(TOKEN) $('#main').innerHTML=`<div class="card lockmsg"><div class="big">📡</div><h2>Connexion au serveur impossible</h2><p>${esc(e.message)}</p><button class="btn primary" id="retryBoot">Réessayer</button></div>`;
    const b=$('#retryBoot'); if(b) b.onclick=boot; return; }
  ME=r.user; S=r.state||{}; normalizeS();
  S.name=ME.name; S.group=ME.group; S.trainer = ME.role==='trainer';
  SHOTS={}; (r.shots||[]).forEach(s=>SHOTS[s.tp+'_'+s.slot]={name:s.name, at:s.at});
  if(S.theme){ document.documentElement.dataset.theme=S.theme; try{ localStorage.setItem(THEME_KEY,S.theme); }catch(e){} }
  current = S.current && idx(S.current)>=0 ? S.current : 'm0';
  $('#trainerBtn').hidden = !S.trainer;
  renderTop();
  if(S.trainer) renderTrainer(); else renderAll();
}

boot();
</script>
