# Déploiement en 1 clic sur Render (https://render.com) :
# Dashboard → New → Blueprint → choisir le dépôt GitHub contenant ce projet.
# Render crée le service web + une base PostgreSQL et vous demande TRAINER_CODE et CLASS_CODE.
services:
  - type: web
    name: jira-academy
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jira-academy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRAINER_CODE
        sync: false
      - key: CLASS_CODE
        sync: false

databases:
  - name: jira-academy-db
    plan: free
    region: frankfurt
    databaseName: jira_academy
    user: jira_academy
